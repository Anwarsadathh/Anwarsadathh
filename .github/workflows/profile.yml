name: Update profile stats & snake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Accurate stats from GitHub's own contribution calendar.
      # Add a classic PAT (scopes: repo, read:user) as the METRICS_TOKEN secret
      # so private contributions & private-repo languages are counted too.
      - name: Generate stats cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          EXCLUDE_LANGS: ""   # e.g. "Handlebars,EJS" to hide template languages
        run: node scripts/generate-stats.mjs dist

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#7c3aed&color_dots=#eef2f9,#bae6fd,#67e8f9,#22d3ee,#0891b2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161f33,#0e4a5c,#0e7490,#06b6d4,#67e8f9

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile assets [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
