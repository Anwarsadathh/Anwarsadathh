<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" fill="none" role="img" aria-label="Multi-tenant Admissions CRM">
<defs>
  <linearGradient id="p0bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
  <linearGradient id="p0card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fe"/></linearGradient>
  <linearGradient id="p0acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#059669"/></linearGradient>
  <filter id="p0blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <pattern id="p0dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#0f172a" fill-opacity="0.1"/></pattern>
  <radialGradient id="p0glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#0891b2" stop-opacity=".22"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif}
  .mono{font-family:'SF Mono', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace}
  .fade{animation:fade .8s ease-out backwards}
  .up{animation:up .9s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="879" height="189" rx="16" fill="url(#p0card)" stroke="#dfe6f3"/>
<rect x=".5" y=".5" width="879" height="189" rx="16" fill="url(#p0glow)"/>
<rect x="28" y="0" width="56" height="3" rx="1.5" fill="#0891b2"/>
<g class="up">
  <text x="28" y="40" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#0891b2">FLAGSHIP · PRODUCTION</text>
  <text x="852" y="40" text-anchor="end" font-size="12" font-weight="600" fill="#55657f">private · ThinkerNational</text>
  <text x="28" y="74" font-size="23" font-weight="800" fill="#0b1224" letter-spacing="-.4">Multi-tenant Admissions CRM</text>
</g>
<g class="up" style="animation-delay:.12s"><text x="28" y="104" font-size="13.5" fill="#55657f">One deployment serving an institution's sales team and 500+ partner agencies — tenant isolation</text><text x="28" y="124" font-size="13.5" fill="#55657f">via a Mongoose plugin, 5-role RBAC, rules-based lead routing and two-way WhatsApp / SMS / RCS.</text></g>
<g class="up" style="animation-delay:.24s"><rect x="28" y="146" width="71" height="24" rx="7" fill="#eef2fb" stroke="#dfe6f3"/>
<text x="63.5" y="162" text-anchor="middle" font-size="11.5" font-weight="600" class="mono" fill="#334155">Next.js</text><rect x="105" y="146" width="92" height="24" rx="7" fill="#eef2fb" stroke="#dfe6f3"/>
<text x="151" y="162" text-anchor="middle" font-size="11.5" font-weight="600" class="mono" fill="#334155">TypeScript</text><rect x="203" y="146" width="71" height="24" rx="7" fill="#eef2fb" stroke="#dfe6f3"/>
<text x="238.5" y="162" text-anchor="middle" font-size="11.5" font-weight="600" class="mono" fill="#334155">Node.js</text><rect x="280" y="146" width="71" height="24" rx="7" fill="#eef2fb" stroke="#dfe6f3"/>
<text x="315.5" y="162" text-anchor="middle" font-size="11.5" font-weight="600" class="mono" fill="#334155">MongoDB</text><rect x="357" y="146" width="106" height="24" rx="7" fill="#eef2fb" stroke="#dfe6f3"/>
<text x="410" y="162" text-anchor="middle" font-size="11.5" font-weight="600" class="mono" fill="#334155">Redis queues</text></g>
<g class="up" style="animation-delay:0.35s">
  <text x="580" y="156" font-size="26" font-weight="800" fill="url(#p0acc)">800+</text>
  <text x="580" y="174" font-size="11" font-weight="600" fill="#55657f">leads / day</text></g><g class="up" style="animation-delay:0.47s">
  <text x="680" y="156" font-size="26" font-weight="800" fill="url(#p0acc)">1,100+</text>
  <text x="680" y="174" font-size="11" font-weight="600" fill="#55657f">users</text></g><g class="up" style="animation-delay:0.59s">
  <text x="780" y="156" font-size="26" font-weight="800" fill="url(#p0acc)">100k+</text>
  <text x="780" y="174" font-size="11" font-weight="600" fill="#55657f">records</text></g>
</svg>