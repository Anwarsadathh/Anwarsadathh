<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" fill="none" role="img" aria-label="Anwar Sadath — Full Stack Engineer">
<defs>
  <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  <linearGradient id="hcard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1324"/><stop offset="1" stop-color="#121c33"/></linearGradient>
  <linearGradient id="hacc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <filter id="hblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <pattern id="hdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.1"/></pattern>
  <clipPath id="hclip"><rect width="880" height="300" rx="20"/></clipPath>
</defs>
<style>
  text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif}
  .mono{font-family:'SF Mono', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace}
  .fade{animation:fade .8s ease-out backwards}
  .up{animation:up .9s cubic-bezier(.2,.8,.2,1) backwards}
  @keyframes fade{from{opacity:0}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .orb1{animation:o1 14s ease-in-out infinite alternate}
  .orb2{animation:o2 17s ease-in-out infinite alternate}
  .orb3{animation:o3 12s ease-in-out infinite alternate}
  @keyframes o1{to{transform:translate(90px,40px)}}
  @keyframes o2{to{transform:translate(-110px,-30px)}}
  @keyframes o3{to{transform:translate(60px,-50px)}}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
</style>
<g clip-path="url(#hclip)">
  <rect width="880" height="300" fill="url(#hbg)"/>
  <g filter="url(#hblur)" opacity="0.35">
    <circle class="orb1" cx="160" cy="40" r="120" fill="#22d3ee"/>
    <circle class="orb2" cx="720" cy="260" r="140" fill="#a78bfa"/>
    <circle class="orb3" cx="470" cy="330" r="90" fill="#34d399"/>
  </g>
  <rect width="880" height="300" fill="url(#hdots)"/>
</g>
<rect x=".5" y=".5" width="879" height="299" rx="20" stroke="#1e2a44"/>

<g class="up" style="animation-delay:.05s">
  <rect x="40" y="38" width="196" height="26" rx="13" fill="#16213a" stroke="#1e2a44"/>
  <circle class="pulse" cx="55" cy="51" r="4" fill="#34d399"/>
  <circle cx="55" cy="51" r="4" fill="#34d399"/>
  <text x="67" y="55.5" font-size="12" font-weight="600" fill="#c7d2e6">Bengaluru, India · Open to roles</text>
</g>
<g class="up" style="animation-delay:.15s">
  <text x="38" y="124" font-size="52" font-weight="800" fill="#eef3fb" letter-spacing="-1.5">Anwar Sadath</text>
</g>
<g class="up" style="animation-delay:.3s">
  <text x="40" y="162" font-size="22" font-weight="700" fill="url(#hacc)">Full Stack Engineer</text>
</g>
<g class="up" style="animation-delay:.45s">
  <text x="40" y="194" font-size="14" fill="#8a97b0">I build multi-tenant SaaS, CRMs and marketplaces that ship — and scale.</text>
</g>
<g class="up" style="animation-delay:.6s"><rect x="40" y="222" width="129.5" height="26" rx="13" fill="#16213a" stroke="#1e2a44"/>
<circle cx="53" cy="235" r="3.5" fill="#22d3ee"/>
<text x="62" y="239.5" font-size="12" font-weight="600" fill="#c7d2e6">4+ yrs shipping</text><rect x="177.5" y="222" width="157.1" height="26" rx="13" fill="#16213a" stroke="#1e2a44"/>
<circle cx="190.5" cy="235" r="3.5" fill="#a78bfa"/>
<text x="199.5" y="239.5" font-size="12" font-weight="600" fill="#c7d2e6">20+ production apps</text><rect x="342.6" y="222" width="150.2" height="26" rx="13" fill="#16213a" stroke="#1e2a44"/>
<circle cx="355.6" cy="235" r="3.5" fill="#34d399"/>
<text x="364.6" y="239.5" font-size="12" font-weight="600" fill="#c7d2e6">800+ leads/day CRM</text></g>

<g class="up" style="animation-delay:.25s">
  <rect x="530" y="40" width="312" height="220" rx="14" fill="#0a0f1d" stroke="#1e2a44"/>
  <path d="M530 54a14 14 0 0 1 14-14h284a14 14 0 0 1 14 14v18H530z" fill="#141d31"/>
  <circle cx="548" cy="56" r="5" fill="#ff5f57"/><circle cx="564" cy="56" r="5" fill="#febc2e"/><circle cx="580" cy="56" r="5" fill="#28c840"/>
  <text x="686" y="60" text-anchor="middle" font-size="11" class="mono" fill="#5c6a85">~/anwar — zsh</text>
</g>
<g class="fade" style="animation-delay:0.6s">
  <text x="548" y="108" font-size="12.5" class="mono" fill="#34d399">$<tspan fill="#e6edf7" dx="8">whoami</tspan></text>
</g>
<g class="fade" style="animation-delay:1.05s">
  <text x="548" y="128" font-size="12" class="mono" fill="#8a97b0">anwar — software engineer, bengaluru</text>
</g><g class="fade" style="animation-delay:1.6s">
  <text x="548" y="156" font-size="12.5" class="mono" fill="#34d399">$<tspan fill="#e6edf7" dx="8">cat stack.txt</tspan></text>
</g>
<g class="fade" style="animation-delay:2.0500000000000003s">
  <text x="548" y="176" font-size="12" class="mono" fill="#8a97b0">next.js · node · mongodb · redis · aws</text>
</g><g class="fade" style="animation-delay:2.6s">
  <text x="548" y="204" font-size="12.5" class="mono" fill="#34d399">$<tspan fill="#e6edf7" dx="8">git push origin main</tspan></text>
</g>
<g class="fade" style="animation-delay:3.0500000000000003s">
  <text x="548" y="224" font-size="12" class="mono" fill="#34d399">✓ deployed to production</text>
</g>
<g class="fade" style="animation-delay:3.4s"><text x="548" y="246" font-size="12.5" class="mono" fill="#34d399">$</text><rect class="cursor" x="562" y="236" width="8" height="14" fill="#e6edf7"/></g>
</svg>